<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="A value, a Promise, and Observables over time">
<title>A value, a Promise, and Observables over time</title>
<defs><marker id="arrow-bdbdbd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bdbdbd"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="399" rx="12" fill="#ffffff" stroke="#e0e0e0"/>
<text x="30.0" y="36.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#212121">Values over time</text>
<text x="30.0" y="58.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#616161">Each row is one way of getting data. Time runs left to right; a dot is a value arriving, a bar means &quot;finished&quot;.</text>
<text x="30.0" y="105.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="normal" text-anchor="start" fill="#212121">const x = 5</text>
<text x="30.0" y="123.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#616161">there already, no waiting</text>
<line x1="280.0" y1="100.0" x2="920.0" y2="100.0" stroke="#bdbdbd" stroke-width="1.5" marker-end="url(#arrow-bdbdbd)"/>
<circle cx="290.0" cy="100.0" r="12" fill="#5e35b1" stroke="#5e35b1" stroke-width="1.5"/>
<text x="290.0" y="104.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">5</text>
<text x="30.0" y="161.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="normal" text-anchor="start" fill="#212121">Promise</text>
<text x="30.0" y="179.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#616161">one value, later, then done</text>
<line x1="280.0" y1="156.0" x2="920.0" y2="156.0" stroke="#bdbdbd" stroke-width="1.5" marker-end="url(#arrow-bdbdbd)"/>
<line x1="582.0" y1="144.0" x2="582.0" y2="168.0" stroke="#212121" stroke-width="2.5"/>
<circle cx="560.0" cy="156.0" r="12" fill="#5e35b1" stroke="#5e35b1" stroke-width="1.5"/>
<text x="560.0" y="160.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">v</text>
<text x="30.0" y="217.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="normal" text-anchor="start" fill="#212121">of(countries)</text>
<text x="30.0" y="235.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#616161">one value right away, then done</text>
<line x1="280.0" y1="212.0" x2="920.0" y2="212.0" stroke="#bdbdbd" stroke-width="1.5" marker-end="url(#arrow-bdbdbd)"/>
<line x1="338.0" y1="200.0" x2="338.0" y2="224.0" stroke="#212121" stroke-width="2.5"/>
<circle cx="296.0" cy="212.0" r="12" fill="#5e35b1" stroke="#5e35b1" stroke-width="1.5"/>
<text x="296.0" y="216.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">c</text>
<text x="30.0" y="273.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="normal" text-anchor="start" fill="#212121">http.get(url)</text>
<text x="30.0" y="291.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#616161">one response when it arrives</text>
<line x1="280.0" y1="268.0" x2="920.0" y2="268.0" stroke="#bdbdbd" stroke-width="1.5" marker-end="url(#arrow-bdbdbd)"/>
<line x1="492.0" y1="256.0" x2="492.0" y2="280.0" stroke="#212121" stroke-width="2.5"/>
<circle cx="470.0" cy="268.0" r="12" fill="#5e35b1" stroke="#5e35b1" stroke-width="1.5"/>
<text x="470.0" y="272.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">r</text>
<text x="30.0" y="329.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="normal" text-anchor="start" fill="#212121">timer(0, 30 min)</text>
<text x="30.0" y="347.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#616161">a new value every 30 min, forever</text>
<line x1="280.0" y1="324.0" x2="920.0" y2="324.0" stroke="#bdbdbd" stroke-width="1.5" marker-end="url(#arrow-bdbdbd)"/>
<circle cx="296.0" cy="324.0" r="12" fill="#5e35b1" stroke="#5e35b1" stroke-width="1.5"/>
<text x="296.0" y="328.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">0</text>
<circle cx="560.0" cy="324.0" r="12" fill="#5e35b1" stroke="#5e35b1" stroke-width="1.5"/>
<text x="560.0" y="328.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">1</text>
<circle cx="830.0" cy="324.0" r="12" fill="#5e35b1" stroke="#5e35b1" stroke-width="1.5"/>
<text x="830.0" y="328.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">2</text>
<text x="920.0" y="360.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#616161">time →</text>
<text x="280.0" y="88.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" text-anchor="start" fill="#ef6c00">subscribe()</text>
<line x1="280.0" y1="92.0" x2="280.0" y2="340.0" stroke="#ef6c00" stroke-width="1.5" stroke-dasharray="5 4"/>
</svg>
