<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="A multi-stage Docker build">
<title>A multi-stage Docker build</title>
<defs><marker id="arrow-757575" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#757575"/></marker><marker id="arrow-ef6c00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="399" rx="12" fill="#ffffff" stroke="#e0e0e0"/>
<text x="30.0" y="36.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#212121">The two stages of our Dockerfile</text>
<rect x="30.0" y="60.0" width="420.0" height="320.0" rx="12" fill="#fafafa" stroke="#e0e0e0" stroke-width="1.5"/>
<text x="50.0" y="86.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="start" fill="#212121">Stage 1: build   FROM node:24-alpine</text>
<rect x="55.0" y="105.0" width="370.0" height="34.0" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
<text x="240.0" y="127.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#212121">COPY package.json package-lock.json</text>
<rect x="55.0" y="155.0" width="370.0" height="34.0" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
<text x="240.0" y="177.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#212121">RUN npm ci</text>
<line x1="240.0" y1="139.0" x2="240.0" y2="153.0" stroke="#757575" stroke-width="1.5" marker-end="url(#arrow-757575)"/>
<rect x="55.0" y="205.0" width="370.0" height="34.0" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
<text x="240.0" y="227.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#212121">COPY . .</text>
<line x1="240.0" y1="189.0" x2="240.0" y2="203.0" stroke="#757575" stroke-width="1.5" marker-end="url(#arrow-757575)"/>
<rect x="55.0" y="255.0" width="370.0" height="34.0" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
<text x="240.0" y="277.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#212121">RUN npm run fetch-data</text>
<line x1="240.0" y1="239.0" x2="240.0" y2="253.0" stroke="#757575" stroke-width="1.5" marker-end="url(#arrow-757575)"/>
<rect x="55.0" y="305.0" width="370.0" height="34.0" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
<text x="240.0" y="327.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#212121">RUN npm run build</text>
<line x1="240.0" y1="289.0" x2="240.0" y2="303.0" stroke="#757575" stroke-width="1.5" marker-end="url(#arrow-757575)"/>
<text x="240.0" y="372.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#616161" font-style="italic">Left behind: Node.js, node_modules, source code</text>
<rect x="610.0" y="60.0" width="320.0" height="320.0" rx="12" fill="#fafafa" stroke="#e0e0e0" stroke-width="1.5"/>
<text x="630.0" y="86.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="start" fill="#212121">Stage 2: serve   FROM nginx:alpine</text>
<rect x="625.0" y="165.0" width="290.0" height="70.0" rx="8" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
<text x="770.0" y="205.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#212121"></text>
<text x="770.0" y="187.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#212121">/usr/share/nginx/html</text>
<text x="770.0" y="206.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#616161">index.html, main-*.js, …</text>
<text x="770.0" y="222.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#616161">data/indicators.json</text>
<rect x="625.0" y="270.0" width="290.0" height="40.0" rx="8" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
<text x="770.0" y="295.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#212121">nginx.conf</text>
<path d="M425,322 C500,322 520,200 623.0,200" fill="none" stroke="#ef6c00" stroke-width="1.5" marker-end="url(#arrow-ef6c00)"/>
<text x="530.0" y="168.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#ef6c00">COPY --from=build</text>
<text x="530.0" y="183.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#ef6c00">dist/.../browser</text>
<text x="770.0" y="360.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#616161" font-style="italic">This image is what runs on the server.</text>
</svg>
