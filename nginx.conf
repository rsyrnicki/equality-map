server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular's Router uses the HTML5 history API, so any path that doesn't
    # match a real file must still serve index.html and let the Router
    # take over client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
